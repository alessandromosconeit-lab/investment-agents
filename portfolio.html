<meta charset="UTF-8">

<title>Portfolio Dashboard — ISP + UCG</title>

<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bd:#30363d;
  --tx:#e6edf3;--mu:#7d8590;
  --gr:#3fb950;--rd:#f85149;--bl:#58a6ff;--yl:#d29922;--or:#ffa657;--pu:#bc8cff;
  --isp:#58a6ff;--ucg:#3fb950;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:var(--or);font-weight:700;font-size:15px;letter-spacing:1px}
.back-link{color:var(--bl);text-decoration:none;font-size:12px}
.back-link:hover{text-decoration:underline}
.last-upd{color:var(--mu);font-size:11px}

/* LAYOUT */
.container{padding:20px 24px;max-width:1600px;margin:0 auto}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--bd)}
.tab{padding:8px 18px;cursor:pointer;border-radius:6px 6px 0 0;color:var(--mu);
  font-size:12px;font-weight:600;letter-spacing:.5px;border:1px solid transparent;
  border-bottom:none;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--tx);border-color:var(--bd);background:var(--bg2);border-top:2px solid var(--bl)}
.section{display:none}.section.active{display:block}

/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:16px}
.card-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:6px}
.card-value{font-size:20px;font-weight:700}
.card-sub{font-size:11px;color:var(--mu);margin-top:4px}
.card.isp{border-top:2px solid var(--isp)}
.card.ucg{border-top:2px solid var(--ucg)}
.card.total{border-top:2px solid var(--or)}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* BOX */
.box{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
.box-header{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.box-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.box-body{padding:0}
.chart-wrap{padding:16px;height:260px;position:relative}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;text-align:left;font-size:10px;text-transform:uppercase;
  letter-spacing:.8px;color:var(--mu);border-bottom:1px solid var(--bd);background:var(--bg3);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--bd);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3);cursor:pointer}
.ticker-sym{font-weight:700;color:var(--bl);font-size:13px;font-family:monospace}
.ticker-name{color:var(--mu);font-size:11px;margin-top:1px}
.ptf-badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}
.ptf-isp{background:rgba(88,166,255,.15);color:var(--isp)}
.ptf-ucg{background:rgba(63,185,80,.15);color:var(--ucg)}
.pos{color:var(--gr)}.neg{color:var(--rd)}.neu{color:var(--mu)}

/* SEMAPHORE */
.flag-pp{color:#f85149;font-weight:700}
.flag-p{color:#ffa657;font-weight:600}
.flag-m{color:#7d8590}
.flag-mm{color:#3fb950;font-weight:700}

/* BOND */
.bond-row{background:rgba(88,166,255,.04)}
.ytm-high{color:var(--rd)}
.ytm-mid{color:var(--yl)}
.ytm-low{color:var(--gr)}
.plneg{color:var(--rd)}.plpos{color:var(--gr)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--mu);gap:12px}
.spinner{width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--bl);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.filter-btn{padding:4px 12px;border-radius:12px;border:1px solid var(--bd);background:transparent;
  color:var(--mu);cursor:pointer;font-size:12px;transition:all .15s}
.filter-btn:hover{border-color:var(--bl);color:var(--bl)}
.filter-btn.active{background:rgba(88,166,255,.15);border-color:var(--bl);color:var(--bl)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt  = (v,d=2) => v != null ? Number(v).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—';
const fmtE = v => v != null ? '€' + fmt(v,0) : '—';
const fmtP = v => v != null ? (v>=0?'+':'')+fmt(v,2)+'%' : '—';
const pCls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
const flagCls = f => f==='▲▲'?'flag-pp':f==='▲'?'flag-p':f==='▼'?'flag-mm':f==='▼▼'?'flag-mm':'flag-m';

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const idx = ['overview','holdings','multipli','bonds'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById(`section-${name}`).classList.add('active');
  if (name === 'multipli') renderMultipli();
  if (name === 'bonds')    renderBonds();
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch(`${BASE_URL}/data/portfolio_prices.json`);
    if (r.ok) {
      snapshot = await r.json();
      document.getElementById('lastUpd').textContent =
        'Prezzi aggiornati: ' + new Date(snapshot.updated).toLocaleString('it-IT');
    }
  } catch(e) {
    document.getElementById('lastUpd').textContent = 'Dati statici (prezzi da Excel, luglio 2026)';
  }
  renderOverview();
  renderHoldings();
}
